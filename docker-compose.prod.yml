name: appunions

x-app-env: &app-env
  TZ: ${TZ:-Asia/Shanghai}
  NODE_ENV: production
  PORT: "8787"
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  ICONS_DIR: /app/data/icons
  JWT_SECRET: ${JWT_SECRET}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  AUTH_ECHO_CODE: ${AUTH_ECHO_CODE:-false}
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
  CRON_SECRET: ${CRON_SECRET:-}
  SENDCLOUD_API_USER: ${SENDCLOUD_API_USER:-}
  SENDCLOUD_API_KEY: ${SENDCLOUD_API_KEY:-}
  SENDCLOUD_FROM: ${SENDCLOUD_FROM:-}
  SENDCLOUD_FROM_NAME: ${SENDCLOUD_FROM_NAME:-AppUnions}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  migrate:
    image: appunions-app:local
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm db:migrate
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    image: appunions-app:local
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @appunions/api start
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUBLISH_PORT:-18080}:8787"
    environment:
      <<: *app-env
    volumes:
      - icons:/app/data/icons
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

volumes:
  pgdata:
  icons:
