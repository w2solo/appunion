previews:
  generation: automatic

databases:
  - name: appunions-db
    databaseName: appunions
    user: appunions
    postgresMajorVersion: 16

services:
  - type: web
    name: appunions
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @appunions/web build
    startCommand: pnpm db:migrate && pnpm --filter @appunions/api start
    healthCheckPath: /health
    disk:
      name: appunions-icons
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ICONS_DIR
        value: /var/data/icons
      - key: COOKIE_SECURE
        value: "true"
      - key: AUTH_ECHO_CODE
        value: "false"
      - key: SENDCLOUD_FROM_NAME
        value: AppUnions
      - key: DATABASE_URL
        fromDatabase:
          name: appunions-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SENDCLOUD_API_USER
        sync: false
      - key: SENDCLOUD_API_KEY
        sync: false
      - key: SENDCLOUD_FROM
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        sync: false
